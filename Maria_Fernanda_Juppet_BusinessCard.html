<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maria Fernanda Juppet - Kyros Strategic Consulting</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            max-width: 400px;
            width: 100%;
            overflow: hidden;
            animation: slideUp 0.6s ease-out;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .header {
            background: linear-gradient(135deg, #2d3436 0%, #000000 100%);
            padding: 40px 30px 30px;
            text-align: center;
            position: relative;
        }
        
        .photo-container {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            overflow: hidden;
            margin: 0 auto 20px;
            border: 5px solid white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }
        
        .name {
            color: white;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }
        
        .title {
            color: #66E8FF;
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .company {
            color: #aaaaaa;
            font-size: 15px;
            font-weight: 400;
        }
        
        .content {
            padding: 35px 30px;
        }
        
        .contact-item {
            display: flex;
            align-items: center;
            padding: 16px;
            margin-bottom: 12px;
            background: #f8f9fa;
            border-radius: 12px;
            text-decoration: none;
            color: #2d3436;
            transition: all 0.3s ease;
        }
        
        .contact-item:hover {
            background: #e9ecef;
            transform: translateX(5px);
        }
        
        .contact-item svg {
            width: 24px;
            height: 24px;
            margin-right: 15px;
            flex-shrink: 0;
        }
        
        .contact-item .info {
            flex: 1;
        }
        
        .contact-item .label {
            font-size: 11px;
            color: #6c757d;
            margin-bottom: 3px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .contact-item .value {
            font-size: 15px;
            font-weight: 500;
            word-break: break-word;
        }
        
        .save-button {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #2d3436 0%, #000000 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        
        .save-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }
        
        .save-button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <div class="photo-container">
                <img src="fernanda.jpg" alt="Maria Fernanda Juppet">
            </div>
            <h1 class="name">Maria Fernanda Juppet</h1>
            <div class="title">Co-Founder & Chief Sponsor Dreams</div>
            <div class="company">Kyros Strategic Consulting</div>
        </div>
        
        <div class="content">
            <a href="tel:+56981591062" class="contact-item">
                <svg fill="currentColor" viewBox="0 0 24 24">
                    <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
                </svg>
                <div class="info">
                    <div class="label">Phone</div>
                    <div class="value">+56 9 8159 1062</div>
                </div>
            </a>
            
            <a href="mailto:fernanda.juppet@kyrosglobal.co" class="contact-item">
                <svg fill="currentColor" viewBox="0 0 24 24">
                    <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
                </svg>
                <div class="info">
                    <div class="label">Email</div>
                    <div class="value">fernanda.juppet@kyrosglobal.co</div>
                </div>
            </a>
            
            <a href="https://www.linkedin.com/in/mfjuppet/" target="_blank" class="contact-item">
                <svg fill="currentColor" viewBox="0 0 24 24">
                    <path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/>
                </svg>
                <div class="info">
                    <div class="label">LinkedIn</div>
                    <div class="value">mfjuppet</div>
                </div>
            </a>
            
            <button onclick="guardarContacto()" class="save-button">
                Save Contact
            </button>
        </div>
    </div>

    <script>
    function guardarContacto() {
        const vcard = `BEGIN:VCARD
VERSION:3.0
FN:Maria Fernanda Juppet
N:Juppet;Maria Fernanda;;;
TITLE:Co-Founder & Chief Sponsor Dreams
ORG:Kyros Strategic Consulting
TEL;TYPE=CELL:+56 9 8159 1062
EMAIL;TYPE=WORK:fernanda.juppet@kyrosglobal.co
URL:https://www.linkedin.com/in/mfjuppet/
END:VCARD`;

        const blob = new Blob([vcard], { type: 'text/vcard' });
        const url = window.URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'Maria_Fernanda_Juppet_Kyros.vcf';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        window.URL.revokeObjectURL(url);
    }
    </script>
</body>
</html>
